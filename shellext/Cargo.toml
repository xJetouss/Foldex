[package]
name = "foldex_shell"
version = "0.1.0"
edition = "2021"
description = "„Mit Foldex öffnen“ im neuen Kontextmenü von Windows 11 (IExplorerCommand)"

# eigenes kleines Projekt, nicht Teil des Haupt-Builds
[workspace]

[lib]
crate-type = ["cdylib"]
path = "lib.rs"

[dependencies]
windows-core = "0.62"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
